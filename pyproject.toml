[project]
name = "call-me"
version = "0.1.0"
description = "call me maybe"
readme = "README.md"
authors = [
    { name = "cedric", email = "cedric.bouh@42" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = ["llm_sdk"]

[project.scripts]
call-me = "call_me:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
